{% extends "base.html" %}

{% block title %}
Login - TaskFlow
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p>
            Sign in to manage your tasks.
        </p>

        <form
            method="POST"
            class="form"
        >

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="btn primary"
            >
                Login
            </button>

        </form>

        <p class="auth-link">

            Don't have an account?

            <a href="{{ url_for('auth.register') }}">
                Create one
            </a>

        </p>

    </div>

</div>

{% endblock %}
