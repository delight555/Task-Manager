{% extends "base.html" %}

{% block title %}
Register - TaskFlow
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p>
            Start organizing your work today.
        </p>

        <form
            method="POST"
            class="form"
        >

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Choose a username"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <button
                type="submit"
                class="btn primary"
            >
                Create Account
            </button>

        </form>

        <p class="auth-link">

            Already have an account?

            <a href="{{ url_for('auth.login') }}">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
