<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Task Manager
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<header class="navbar">

    <div class="logo">
        TaskFlow
    </div>

    {% if current_user.is_authenticated %}

    <nav>

        <a href="{{ url_for('tasks.index') }}">
            Dashboard
        </a>

        <a href="{{ url_for('auth.logout') }}">
            Logout
        </a>

    </nav>

    {% endif %}

</header>


<main class="container">

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    {% block content %}

    {% endblock %}

</main>


<script
    src="{{ url_for('static', filename='js/app.js') }}"
></script>

</body>

</html>
